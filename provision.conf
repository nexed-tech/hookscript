# /etc/pve/proxdock/provision.conf (cluster-wide, read by proxdock-provision.sh)
DOCKHAND_URL=http://192.168.17.241:3000
# Git repository as named in Dockhand; one subfolder per stack (<name>/compose.yaml, <name>/.env)
REPO_NAME=stacks
# Deployed on every new CT, before the stack-<name> tags
BASE_STACK=caddy-tunnelsync
# Hookscript the CT is switched to once provisioned
NORMAL_HOOK=local:snippets/hookscript.pl
# Dockhand secret provider (by name) for psono:// references in the .env files; optional
#SECRET_PROVIDER=psono
